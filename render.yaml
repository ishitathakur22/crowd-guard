services:
  - type: web
    name: crowd-guard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-deploy.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENABLE_VISION
        value: "0"
      - key: PYTHON_VERSION
        value: 3.11.9
